# ============================================================================
# gitops-bump — composite action que atualiza o newTag de um kustomization
# em um GitOps repo externo, autenticando via GitHub App.
#
# Por que composite action e nao reusable workflow:
#   Reusable workflows em outra organizacao nao recebem organization secrets
#   do caller (mesmo via 'secrets: inherit' ou mapping explicito). Composite
#   actions rodam no mesmo job do caller, entao secrets sao passados como
#   inputs normais e fluem sem restricao cross-org.
#
# Resolucao de placeholders:
#   {repo}  = image-name com sufixo '-prod' ou '-homolog' tirado (basename)
#   {env}   = 'prod' se ref e tag v*; 'homolog' se push em homolog
#   {tag}   = github.ref_name pra tag v*; github.run_id pra homolog
# ============================================================================
name: GitOps bump
description: Bump newTag in a kustomization on an external GitOps repo

inputs:
  gitops-repo:
    description: 'GitOps repo no formato owner/name (ex: mkclub69/mk-microservice-ops).'
    required: true
  app-id:
    description: 'GitHub App ID com permissao no GitOps repo.'
    required: true
  app-private-key:
    description: 'GitHub App private key (PEM). Repasse via secrets.* do caller.'
    required: true
  image-name:
    description: 'Nome da imagem (pode ter sufixo -prod/-homolog; o action tira pra derivar {repo}).'
    required: true
  image-tag:
    description: 'Tag da imagem que sera escrita no newTag.'
    required: true
  path-template:
    description: 'Path do kustomization no GitOps repo. Placeholders: {repo}, {env}. Default: {repo}-{env}/kustomization.yaml.'
    required: false
    default: '{repo}-{env}/kustomization.yaml'
  commit-message-template:
    description: 'Template do commit message. Placeholders: {repo}, {env}, {tag}.'
    required: false
    default: 'chore({repo}): update {env} image to {tag}'
  env-override:
    description: 'Forca o {env} (prod | homolog). Vazio = deriva do github.ref.'
    required: false
    default: ''
  gitops-branch:
    description: 'Branch do GitOps repo p/ commitar o bump. Vazio = branch default.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve env + paths
      id: resolve
      shell: bash
      env:
        PATH_TEMPLATE: ${{ inputs.path-template }}
        COMMIT_TEMPLATE: ${{ inputs.commit-message-template }}
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        GITOPS_REPO: ${{ inputs.gitops-repo }}
        ENV_OVERRIDE: ${{ inputs.env-override }}
      run: |
        set -e
        if [ -n "$ENV_OVERRIDE" ]; then
          ENV="$ENV_OVERRIDE"
        elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          ENV="prod"
        else
          ENV="homolog"
        fi

        REPO_BASE="${IMAGE_NAME%-prod}"
        REPO_BASE="${REPO_BASE%-homolog}"

        PATH_VALUE="${PATH_TEMPLATE//\{repo\}/$REPO_BASE}"
        PATH_VALUE="${PATH_VALUE//\{env\}/$ENV}"

        MSG="${COMMIT_TEMPLATE//\{repo\}/$REPO_BASE}"
        MSG="${MSG//\{env\}/$ENV}"
        MSG="${MSG//\{tag\}/$IMAGE_TAG}"

        OWNER="${GITOPS_REPO%/*}"
        NAME="${GITOPS_REPO#*/}"

        {
          echo "env=${ENV}"
          echo "repo-base=${REPO_BASE}"
          echo "path=${PATH_VALUE}"
          echo "commit-message=${MSG}"
          echo "gitops-owner=${OWNER}"
          echo "gitops-name=${NAME}"
        } >> "$GITHUB_OUTPUT"

        echo "Resolved: env=${ENV} tag=${IMAGE_TAG} path=${PATH_VALUE}"

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.resolve.outputs.gitops-owner }}
        repositories: ${{ steps.resolve.outputs.gitops-name }}

    - name: Checkout GitOps repo
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.gitops-repo }}
        ref: ${{ inputs.gitops-branch }}
        token: ${{ steps.app-token.outputs.token }}
        path: ops-repo

    - name: Bump image tag in kustomization
      shell: bash
      env:
        KUSTOMIZATION_PATH: ${{ steps.resolve.outputs.path }}
        NEW_TAG: ${{ inputs.image-tag }}
      run: |
        set -e
        TARGET="ops-repo/${KUSTOMIZATION_PATH}"
        if [ ! -f "$TARGET" ]; then
          echo "::error::kustomization nao encontrado em ${TARGET}"
          exit 1
        fi
        yq e -i ".images[].newTag = \"${NEW_TAG}\"" "${TARGET}"
        echo "Updated ${TARGET}:"
        yq e '.images' "${TARGET}"

    - name: Commit and push to GitOps repo
      shell: bash
      env:
        KUSTOMIZATION_PATH: ${{ steps.resolve.outputs.path }}
        COMMIT_MSG: ${{ steps.resolve.outputs.commit-message }}
        NEW_TAG: ${{ inputs.image-tag }}
      run: |
        set -e
        cd ops-repo
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add "${KUSTOMIZATION_PATH}"
        if git diff --cached --quiet; then
          echo "::notice::Nenhuma mudanca no kustomization — newTag ja era ${NEW_TAG}."
          exit 0
        fi
        git commit -m "${COMMIT_MSG}"
        git push
