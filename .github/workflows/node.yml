# ============================================================================
# node.yml — wrapper Node.js/TypeScript.
#
# Adiciona testes e dependency scan especificos de Node antes de chamar
# base.yml. Suporta yarn, npm e pnpm.
#
# Fluxo:
#   Jobs paralelos (audit, lint, typecheck, test). Cada um faz seu proprio
#   setup pnpm/node + install pra rodar isoladamente — a falha de um nao
#   bloqueia a visibilidade dos outros (paridade com o padrao classico de
#   CIs separadas por concern). Cache do actions/setup-node mantem o custo
#   do install repetido em ordem de segundos.
#
#   Pipeline `needs:` todos eles e chama base.yml.
# ============================================================================
name: Node pipeline

on:
  workflow_call:
    inputs:
      # ----- inputs especificos de Node --------------------------------------
      node-version:
        description: 'Versao do Node (default 22).'
        required: false
        type: string
        default: '22'
      package-manager:
        description: 'Package manager: yarn | npm | pnpm.'
        required: false
        type: string
        default: 'yarn'
      pnpm-version:
        description: 'Versao do pnpm. Vazio (default) = pnpm/action-setup le de package.json#packageManager. Setar APENAS se o repo nao tem packageManager — conflito explicito gera erro.'
        required: false
        type: string
        default: ''
      install-command:
        description: 'Comando de install. Vazio = decide pelo package-manager (yarn install --immutable / npm ci / pnpm install --frozen-lockfile).'
        required: false
        type: string
        default: ''
      test-command:
        description: 'Comando de testes. Vazio = pula o job test.'
        required: false
        type: string
        default: ''
      lint-command:
        description: 'Comando de lint. Obrigatorio — convencao Widesoftware exige lint sempre rodando.'
        required: true
        type: string
      typecheck-command:
        description: 'Comando de typecheck. Vazio = pula o job typecheck.'
        required: false
        type: string
        default: ''
      pre-install-command:
        description: 'Comando opcional antes do install (ex: corepack enable). Default vazio quando pm=pnpm.'
        required: false
        type: string
        default: ''

      # ----- inputs repassados pro base.yml ----------------------------------
      image-name:        { required: true,  type: string }
      registry:          { required: true,  type: string }
      image-tag:         { required: false, type: string, default: '' }
      dockerfile:        { required: false, type: string, default: 'Dockerfile' }
      dockerfile-target: { required: false, type: string, default: '' }
      build-args:        { required: false, type: string, default: '' }
      build-context:     { required: false, type: string, default: '.' }
      platforms:         { required: false, type: string, default: 'linux/amd64' }
      build-runner:      { required: false, type: string, default: 'ubuntu-latest' }
      do-push:           { required: false, type: boolean, default: true }
      block-on-failure:  { required: false, type: boolean, default: true }
      run-secrets-scan:    { required: false, type: boolean, default: true }
      run-vuln-scan:       { required: false, type: boolean, default: true }
      run-sast:            { required: false, type: boolean, default: true }
      run-dependency-scan: { required: false, type: boolean, default: true }
      semgrep-configs:   { required: false, type: string, default: 'p/owasp-top-ten p/typescript p/react' }
      pr-report:         { required: false, type: boolean, default: true }
      notify-channel:    { required: false, type: string, default: 'none' }
      notify-on:         { required: false, type: string, default: 'failure' }
      slack-channel:     { required: false, type: string, default: '' }
      email-to:          { required: false, type: string, default: '' }
      docker-cache-mode: { required: false, type: string, default: 'gha' }
      docker-cache-ref:  { required: false, type: string, default: '' }
      auth-method:                { required: false, type: string, default: 'docker-login' }
      gcp-workload-identity-provider: { required: false, type: string, default: '' }
      gcp-service-account:        { required: false, type: string, default: '' }
      aws-role-to-assume:         { required: false, type: string, default: '' }
      aws-region:                 { required: false, type: string, default: 'us-east-1' }

    secrets:
      REGISTRY_USERNAME:    { required: false }
      REGISTRY_PASSWORD:    { required: false }
      SLACK_WEBHOOK_URL:    { required: false }
      SMTP_HOST:            { required: false }
      SMTP_PORT:            { required: false }
      SMTP_USERNAME:        { required: false }
      SMTP_PASSWORD:        { required: false }
      SMTP_FROM:            { required: false }

    outputs:
      image-ref:
        description: 'Referencia completa da imagem (registry/name:tag).'
        value: ${{ jobs.pipeline.outputs.image-ref }}
      build-pushed:
        description: 'true se build-push completou com sucesso (caller usa pra rodar gitops mesmo com CI red).'
        value: ${{ jobs.pipeline.outputs.build-pushed }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Dependency audit (pnpm/yarn/npm) — bloqueia HIGH+CRITICAL.
  # ===========================================================================
  audit:
    name: Dependency audit
    if: inputs.run-dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sem version: pnpm/action-setup le de package.json#packageManager.
      - name: Setup pnpm (from packageManager)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version == ''
        uses: pnpm/action-setup@v4

      # Com version: override explicito. Conflita com packageManager se ambos setados.
      - name: Setup pnpm (with version)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Pre-install hook
        if: inputs.pre-install-command != ''
        env:
          CMD: ${{ inputs.pre-install-command }}
        run: bash -c "$CMD"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Cacheia node_modules entre jobs e entre runs. Key = hash dos lockfiles.
      # Restore parcial via restore-keys garante que install ainda valida quando
      # o lockfile muda; cache miss completo ainda roda install do zero.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: node-modules-${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
          CUSTOM: ${{ inputs.install-command }}
        run: |
          if [ -n "$CUSTOM" ]; then
            bash -c "$CUSTOM"
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --immutable
          else
            npm ci
          fi

      - name: Audit
        id: scan
        continue-on-error: true
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set +e
          HIGH=0
          CRIT=0
          if [ "$PM" = "pnpm" ]; then
            pnpm audit --json 2>/dev/null > pm-audit.json || true
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' pm-audit.json 2>/dev/null || echo 0)
            CRIT=$(jq '.metadata.vulnerabilities.critical // 0' pm-audit.json 2>/dev/null || echo 0)
          elif [ "$PM" = "yarn" ]; then
            yarn npm audit --recursive --all --severity high --json 2>/dev/null > pm-audit.json || true
            HIGH=$(jq -s '[.[] | select(.children.Severity=="High")] | length' pm-audit.json 2>/dev/null || echo 0)
            CRIT=$(jq -s '[.[] | select(.children.Severity=="Critical")] | length' pm-audit.json 2>/dev/null || echo 0)
          else
            npm audit --json --audit-level=high 2>/dev/null > pm-audit.json || true
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' pm-audit.json 2>/dev/null || echo 0)
            CRIT=$(jq '.metadata.vulnerabilities.critical // 0' pm-audit.json 2>/dev/null || echo 0)
          fi
          TOTAL=$((HIGH + CRIT))
          {
            echo "high=$HIGH"
            echo "crit=$CRIT"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"
          [ "$TOTAL" -gt 0 ] && exit 1 || exit 0

      - name: Render summary
        if: always()
        env:
          PM: ${{ inputs.package-manager }}
          HIGH: ${{ steps.scan.outputs.high }}
          CRIT: ${{ steps.scan.outputs.crit }}
          TOTAL: ${{ steps.scan.outputs.total }}
        run: |
          set +e
          {
            echo "## Dependency audit (${PM})"
            echo ""
            if [ "${TOTAL:-0}" -eq 0 ]; then
              echo "Nenhuma vulnerabilidade HIGH/CRITICAL."
            else
              echo "**${TOTAL} vulnerabilidade(s)** (HIGH=${HIGH}, CRITICAL=${CRIT})."
              echo ""
              if [ "$PM" = "pnpm" ] || [ "$PM" = "npm" ]; then
                echo "| Severidade | Modulo | Via |"
                echo "|---|---|---|"
                jq -r '.advisories // .vulnerabilities // {} | to_entries[] | .value | select(.severity=="high" or .severity=="critical") | "| \(.severity | ascii_upcase) | `\(.name // .module_name // "?")` | \(.via[0].title // .title // "—") |"' pm-audit.json 2>/dev/null | head -20 || true
              fi
            fi
            echo ""
            echo "> Artifact completo: \`pm-audit-report\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "${{ steps.scan.outcome }}" = "failure" ] && STATUS=failure
          jq -n \
            --arg tool "Dependency audit" \
            --arg status "$STATUS" \
            --arg summary "${TOTAL:-0} HIGH/CRITICAL" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-audit.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-audit-report
          path: pm-audit.json
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-audit
          path: counts-audit.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure' && inputs.block-on-failure
        run: exit 1

  # ===========================================================================
  # Lint — obrigatorio. Roda sempre; falha o job se lint-command sair != 0.
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sem version: pnpm/action-setup le de package.json#packageManager.
      - name: Setup pnpm (from packageManager)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version == ''
        uses: pnpm/action-setup@v4

      # Com version: override explicito. Conflita com packageManager se ambos setados.
      - name: Setup pnpm (with version)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Pre-install hook
        if: inputs.pre-install-command != ''
        env:
          CMD: ${{ inputs.pre-install-command }}
        run: bash -c "$CMD"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Cacheia node_modules entre jobs e entre runs. Key = hash dos lockfiles.
      # Restore parcial via restore-keys garante que install ainda valida quando
      # o lockfile muda; cache miss completo ainda roda install do zero.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: node-modules-${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
          CUSTOM: ${{ inputs.install-command }}
        run: |
          if [ -n "$CUSTOM" ]; then
            bash -c "$CUSTOM"
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --immutable
          else
            npm ci
          fi

      - name: Lint
        id: scan
        continue-on-error: true
        env:
          CMD: ${{ inputs.lint-command }}
        run: |
          set +e
          bash -c "$CMD" 2>&1 | tee lint.log
          echo "${PIPESTATUS[0]}" > lint.exit
          exit "$(cat lint.exit)"

      - name: Render summary
        if: always()
        run: |
          set +e
          EXIT=$(cat lint.exit 2>/dev/null || echo 0)
          TOTAL=$(grep -cE '^[[:space:]]+[0-9]+:[0-9]+|[[:space:]]error' lint.log 2>/dev/null || echo 0)
          {
            echo "## Lint"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Sem erros de lint."
            else
              echo "**${TOTAL} erro(s) de lint reportado(s).** Trecho final:"
              echo ""
              echo '```'
              tail -40 lint.log
              echo '```'
            fi
            echo ""
            echo "> Artifact completo: \`lint-log\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Lint" \
            --arg status "$STATUS" \
            --arg summary "${TOTAL} erro(s)" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-lint.json

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-lint
          path: counts-lint.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure' && inputs.block-on-failure
        run: exit 1

  # ===========================================================================
  # Typecheck — pula se typecheck-command vazio.
  # ===========================================================================
  typecheck:
    name: Typecheck
    if: inputs.typecheck-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sem version: pnpm/action-setup le de package.json#packageManager.
      - name: Setup pnpm (from packageManager)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version == ''
        uses: pnpm/action-setup@v4

      # Com version: override explicito. Conflita com packageManager se ambos setados.
      - name: Setup pnpm (with version)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Pre-install hook
        if: inputs.pre-install-command != ''
        env:
          CMD: ${{ inputs.pre-install-command }}
        run: bash -c "$CMD"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Cacheia node_modules entre jobs e entre runs. Key = hash dos lockfiles.
      # Restore parcial via restore-keys garante que install ainda valida quando
      # o lockfile muda; cache miss completo ainda roda install do zero.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: node-modules-${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
          CUSTOM: ${{ inputs.install-command }}
        run: |
          if [ -n "$CUSTOM" ]; then
            bash -c "$CUSTOM"
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --immutable
          else
            npm ci
          fi

      - name: Typecheck
        id: scan
        continue-on-error: true
        env:
          CMD: ${{ inputs.typecheck-command }}
        run: |
          set +e
          bash -c "$CMD" 2>&1 | tee typecheck.log
          echo "${PIPESTATUS[0]}" > typecheck.exit
          exit "$(cat typecheck.exit)"

      - name: Render summary
        if: always()
        run: |
          set +e
          EXIT=$(cat typecheck.exit 2>/dev/null || echo 0)
          TOTAL=$(grep -cE '^.*error TS[0-9]+:' typecheck.log 2>/dev/null || echo 0)
          {
            echo "## Typecheck"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Sem erros de tipagem."
            else
              echo "**${TOTAL} erro(s) de tipo.** Trecho final:"
              echo ""
              echo '```'
              tail -40 typecheck.log
              echo '```'
            fi
            echo ""
            echo "> Artifact completo: \`typecheck-log\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Typecheck" \
            --arg status "$STATUS" \
            --arg summary "${TOTAL} erro(s)" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-typecheck.json

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-typecheck
          path: counts-typecheck.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure' && inputs.block-on-failure
        run: exit 1

  # ===========================================================================
  # Test — pula se test-command vazio.
  # ===========================================================================
  test:
    name: Tests
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sem version: pnpm/action-setup le de package.json#packageManager.
      - name: Setup pnpm (from packageManager)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version == ''
        uses: pnpm/action-setup@v4

      # Com version: override explicito. Conflita com packageManager se ambos setados.
      - name: Setup pnpm (with version)
        if: inputs.package-manager == 'pnpm' && inputs.pnpm-version != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Pre-install hook
        if: inputs.pre-install-command != ''
        env:
          CMD: ${{ inputs.pre-install-command }}
        run: bash -c "$CMD"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Cacheia node_modules entre jobs e entre runs. Key = hash dos lockfiles.
      # Restore parcial via restore-keys garante que install ainda valida quando
      # o lockfile muda; cache miss completo ainda roda install do zero.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: node-modules-${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
          CUSTOM: ${{ inputs.install-command }}
        run: |
          if [ -n "$CUSTOM" ]; then
            bash -c "$CUSTOM"
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --immutable
          else
            npm ci
          fi

      - name: Run tests
        id: scan
        continue-on-error: true
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          set +e
          bash -c "$CMD" 2>&1 | tee tests.log
          echo "${PIPESTATUS[0]}" > tests.exit
          exit "$(cat tests.exit)"

      - name: Render summary
        if: always()
        run: |
          set +e
          EXIT=$(cat tests.exit 2>/dev/null || echo 0)
          {
            echo "## Tests"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Suite verde."
            else
              echo "**Testes falharam.** Trecho final:"
              echo ""
              echo '```'
              tail -60 tests.log
              echo '```'
            fi
            echo ""
            echo "> Artifact completo: \`tests-log\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Tests" \
            --arg status "$STATUS" \
            --arg summary "$([ "$STATUS" = "success" ] && echo 'passou' || echo "falhas detectadas")" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-tests.json

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: tests.log
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-tests
          path: counts-tests.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure' && inputs.block-on-failure
        run: exit 1

  # ===========================================================================
  # Pipeline (chama base.yml)
  # ---------------------------------------------------------------------------
  # needs: todos os jobs paralelos. Block-on-failure decide se a falha de
  # qualquer um bloqueia o build.
  # ===========================================================================
  pipeline:
    name: Pipeline
    needs:
      - audit
      - lint
      - typecheck
      - test
    # pipeline roda sempre (incluindo se algum check falhou) pra que scans
    # paralelos + Report consolidado sempre gerem feedback no PR. O gate de
    # build-push migrou pro base.yml via `tests-passed`, que aqui agrega o
    # resultado dos 4 jobs (audit/lint/typecheck/test).
    if: always()
    uses: ./.github/workflows/base.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    with:
      image-name:          ${{ inputs.image-name }}
      registry:            ${{ inputs.registry }}
      image-tag:           ${{ inputs.image-tag }}
      dockerfile:          ${{ inputs.dockerfile }}
      dockerfile-target:   ${{ inputs.dockerfile-target }}
      build-args:          ${{ inputs.build-args }}
      build-context:       ${{ inputs.build-context }}
      platforms:           ${{ inputs.platforms }}
      build-runner:        ${{ inputs.build-runner }}
      do-push:             ${{ inputs.do-push }}
      block-on-failure:    ${{ inputs.block-on-failure }}
      tests-passed: >-
        ${{ (needs.audit.result     == 'success' || needs.audit.result     == 'skipped') &&
            (needs.lint.result      == 'success' || needs.lint.result      == 'skipped') &&
            (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
            (needs.test.result      == 'success' || needs.test.result      == 'skipped') }}
      run-secrets-scan:    ${{ inputs.run-secrets-scan }}
      run-vuln-scan:       ${{ inputs.run-vuln-scan }}
      run-sast:            ${{ inputs.run-sast }}
      run-dependency-scan: ${{ inputs.run-dependency-scan }}
      semgrep-configs:     ${{ inputs.semgrep-configs }}
      pr-report:           ${{ inputs.pr-report }}
      notify-channel:      ${{ inputs.notify-channel }}
      notify-on:           ${{ inputs.notify-on }}
      slack-channel:       ${{ inputs.slack-channel }}
      email-to:            ${{ inputs.email-to }}
      docker-cache-mode:   ${{ inputs.docker-cache-mode }}
