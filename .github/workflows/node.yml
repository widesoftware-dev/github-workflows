# ============================================================================
# node.yml — wrapper Node.js/TypeScript.
#
# Adiciona testes e dependency scan especificos de Node antes de chamar
# base.yml. Suporta yarn, npm e pnpm.
#
# Fluxo:
#   1. Job `test`: setup Node + setup do package-manager (pnpm/corepack)
#      + install + lint/typecheck/test (opcionais) + dependency scan
#      (yarn/npm/pnpm audit).
#   2. Job `pipeline`: chama base.yml. needs: test.
# ============================================================================
name: Node pipeline

on:
  workflow_call:
    inputs:
      # ----- inputs especificos de Node --------------------------------------
      node-version:
        description: 'Versao do Node (default 22).'
        required: false
        type: string
        default: '22'
      package-manager:
        description: 'Package manager: yarn | npm | pnpm.'
        required: false
        type: string
        default: 'yarn'
      pnpm-version:
        description: 'Versao do pnpm (so usado quando package-manager=pnpm).'
        required: false
        type: string
        default: '9'
      install-command:
        description: 'Comando de install. Vazio = decide pelo package-manager (yarn install --immutable / npm ci / pnpm install --frozen-lockfile).'
        required: false
        type: string
        default: ''
      test-command:
        description: 'Comando de testes. Vazio = pula. Ex: yarn test, npm test, pnpm test.'
        required: false
        type: string
        default: ''
      lint-command:
        description: 'Comando de lint. Vazio = pula.'
        required: false
        type: string
        default: ''
      typecheck-command:
        description: 'Comando de typecheck. Vazio = pula.'
        required: false
        type: string
        default: ''
      pre-install-command:
        description: 'Comando opcional antes do install (ex: corepack enable). Default vazio quando pm=pnpm (pnpm/action-setup ja resolve).'
        required: false
        type: string
        default: ''

      # ----- inputs repassados pro base.yml ----------------------------------
      image-name:        { required: true,  type: string }
      registry:          { required: true,  type: string }
      image-tag:         { required: false, type: string, default: '' }
      dockerfile:        { required: false, type: string, default: 'Dockerfile' }
      dockerfile-target: { required: false, type: string, default: '' }
      build-args:        { required: false, type: string, default: '' }
      build-context:     { required: false, type: string, default: '.' }
      platforms:         { required: false, type: string, default: 'linux/amd64' }
      do-push:           { required: false, type: boolean, default: true }
      block-on-failure:  { required: false, type: boolean, default: true }
      run-secrets-scan:    { required: false, type: boolean, default: true }
      run-vuln-scan:       { required: false, type: boolean, default: true }
      run-sast:            { required: false, type: boolean, default: true }
      run-dependency-scan: { required: false, type: boolean, default: true }
      run-container-scan:  { required: false, type: boolean, default: true }
      semgrep-configs:   { required: false, type: string, default: 'p/owasp-top-ten p/typescript p/react' }
      pr-report:         { required: false, type: boolean, default: true }
      notify-channel:    { required: false, type: string, default: 'none' }
      notify-on:         { required: false, type: string, default: 'failure' }
      slack-channel:     { required: false, type: string, default: '' }
      email-to:          { required: false, type: string, default: '' }
      # Inputs adicionais do base.yml v1.2.0+ (auth WIF, cargo audit)
      auth-method:                { required: false, type: string, default: 'docker-login' }
      gcp-workload-identity-provider: { required: false, type: string, default: '' }
      gcp-service-account:        { required: false, type: string, default: '' }
      cargo-audit-paths:          { required: false, type: string, default: '' }

    secrets:
      REGISTRY_USERNAME:    { required: false }
      REGISTRY_PASSWORD:    { required: false }
      SLACK_WEBHOOK_URL:    { required: false }
      SMTP_HOST:            { required: false }
      SMTP_PORT:            { required: false }
      SMTP_USERNAME:        { required: false }
      SMTP_PASSWORD:        { required: false }
      SMTP_FROM:            { required: false }

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Testes Node
  # ---------------------------------------------------------------------------
  # Ordem importante:
  #   1. Setup do package manager (pnpm/corepack) ANTES do setup-node, pra
  #      que setup-node consiga resolver o cache da ferramenta corretamente.
  #   2. setup-node com cache: <pm>.
  #   3. Install + audit + lint/typecheck/test.
  # ===========================================================================
  test:
    name: Test (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm precisa do pnpm/action-setup ANTES do setup-node (pnpm nao vem
      # pre-instalado no runner; corepack ainda nao habilita pnpm@9+ por
      # padrao). Yarn 4.x usa corepack via pre-install-command opcional.
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Pre-install hook
        if: inputs.pre-install-command != ''
        env:
          CMD: ${{ inputs.pre-install-command }}
        run: bash -c "$CMD"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Install: usa o comando custom se passado, senao default por gerenciador.
      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
          CUSTOM: ${{ inputs.install-command }}
        run: |
          if [ -n "$CUSTOM" ]; then
            bash -c "$CUSTOM"
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --immutable
          else
            npm ci
          fi

      # Dependency scan: bloqueia HIGH+CRITICAL.
      # pnpm/yarn npm audit: parseamos JSON pra contar — alguns retornam
      # exit code 0 mesmo com vulns.
      - name: Dependency audit
        if: inputs.run-dependency-scan
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -e
          if [ "$PM" = "pnpm" ]; then
            pnpm audit --json 2>/dev/null > pm-audit.json || true
            HIGH_PLUS=$(jq '.metadata.vulnerabilities.critical + .metadata.vulnerabilities.high' pm-audit.json)
            echo "### pnpm audit" >> "$GITHUB_STEP_SUMMARY"
            echo "- High + Critical: ${HIGH_PLUS}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$HIGH_PLUS" -gt 0 ]; then
              echo "::error::pnpm audit encontrou ${HIGH_PLUS} vulnerabilidades HIGH/CRITICAL"
              exit 1
            fi
          elif [ "$PM" = "yarn" ]; then
            yarn npm audit --recursive --all --severity high
          else
            npm audit --audit-level=high
          fi

      - name: Lint
        if: inputs.lint-command != ''
        env:
          CMD: ${{ inputs.lint-command }}
        run: bash -c "$CMD"

      - name: Typecheck
        if: inputs.typecheck-command != ''
        env:
          CMD: ${{ inputs.typecheck-command }}
        run: bash -c "$CMD"

      - name: Run tests
        if: inputs.test-command != ''
        env:
          CMD: ${{ inputs.test-command }}
        run: bash -c "$CMD"

  # ===========================================================================
  # Pipeline (chama base.yml)
  # ===========================================================================
  pipeline:
    name: Pipeline
    needs: test
    uses: ./.github/workflows/base.yml
    secrets: inherit
    # id-token: write necessario quando auth-method=gcp-wif. Concedido
    # incondicionalmente — sem efeito quando docker-login.
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
    with:
      image-name:          ${{ inputs.image-name }}
      registry:            ${{ inputs.registry }}
      image-tag:           ${{ inputs.image-tag }}
      dockerfile:          ${{ inputs.dockerfile }}
      dockerfile-target:   ${{ inputs.dockerfile-target }}
      build-args:          ${{ inputs.build-args }}
      build-context:       ${{ inputs.build-context }}
      platforms:           ${{ inputs.platforms }}
      do-push:             ${{ inputs.do-push }}
      block-on-failure:    ${{ inputs.block-on-failure }}
      run-secrets-scan:    ${{ inputs.run-secrets-scan }}
      run-vuln-scan:       ${{ inputs.run-vuln-scan }}
      run-sast:            ${{ inputs.run-sast }}
      run-dependency-scan: ${{ inputs.run-dependency-scan }}
      run-container-scan:  ${{ inputs.run-container-scan }}
      semgrep-configs:     ${{ inputs.semgrep-configs }}
      pr-report:           ${{ inputs.pr-report }}
      notify-channel:      ${{ inputs.notify-channel }}
      notify-on:           ${{ inputs.notify-on }}
      slack-channel:       ${{ inputs.slack-channel }}
      email-to:            ${{ inputs.email-to }}
      auth-method:                    ${{ inputs.auth-method }}
      gcp-workload-identity-provider: ${{ inputs.gcp-workload-identity-provider }}
      gcp-service-account:            ${{ inputs.gcp-service-account }}
      cargo-audit-paths:              ${{ inputs.cargo-audit-paths }}
