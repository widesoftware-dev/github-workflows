# ============================================================================
# php.yml — wrapper PHP/Laravel.
#
# Adiciona uma camada de testes e dependency scan especificos de PHP antes de
# chamar o base.yml. Stack alvo: Laravel 12 / PHP 8.3+, mas funciona com
# qualquer projeto composer.
#
# Fluxo:
#   1. Job `test`: setup PHP + composer install + phpstan/pint opcional +
#      composer audit (dependency scan) + suite de testes.
#   2. Job `pipeline`: chama base.yml. needs: test. Se test falhar, base nao
#      roda. (Ressalva: em homolog, block-on-failure=false aplica APENAS aos
#      scans dentro do base; o test do wrapper continua sendo bloqueante.
#      Se quiser test nao-bloqueante em homolog, basta pular este wrapper e
#      chamar base.yml diretamente.)
# ============================================================================
name: PHP pipeline

on:
  workflow_call:
    inputs:
      # ----- inputs especificos de PHP ---------------------------------------
      php-version:
        description: 'Versao do PHP (default 8.3).'
        required: false
        type: string
        default: '8.3'
      php-extensions:
        description: 'Extensoes PHP a instalar (separadas por virgula).'
        required: false
        type: string
        default: 'mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis'
      composer-args:
        description: 'Args extras pro composer install.'
        required: false
        type: string
        default: '--no-interaction --prefer-dist --no-progress --optimize-autoloader'
      test-command:
        description: 'Comando de testes (ex: vendor/bin/pest, vendor/bin/phpunit, php artisan test).'
        required: false
        type: string
        default: 'vendor/bin/pest'
      pre-test-command:
        description: 'Script bash opcional executado imediatamente antes do test-command. Use pra subir dependencias do phpunit (mysql/redis via docker compose, fixtures, mix-manifest dummy, etc). Vazio = nao roda. Nao afeta composer audit / phpstan / pint.'
        required: false
        type: string
        default: ''
      pre-test-setup-buildx:
        description: 'Habilita docker/setup-buildx-action@v3 (driver docker-container) antes do pre-test-command. Necessario pra que builds dentro do pre-test usem `--cache-from/--cache-to type=gha`.'
        required: false
        type: boolean
        default: false
      pre-test-registry-host:
        description: 'Host de registry adicional pra login no job test (ex: imagens privadas usadas pelo docker compose do pre-test). Independente do extra-registry-host que vale pro job build-push.'
        required: false
        type: string
        default: ''
      pre-test-registry-username:
        description: 'Username do pre-test-registry. So usado se pre-test-registry-host != "".'
        required: false
        type: string
        default: ''
      pre-test-cache-key:
        description: 'Prefixo da chave do actions/cache@v4 aplicado antes do pre-test-command. Vazio = sem cache. Se pre-test-cache-key-files for setado, a key final vira `<prefixo>-<hashFiles(...)>`.'
        required: false
        type: string
        default: ''
      pre-test-cache-key-files:
        description: 'Glob/paths usados pra computar hash interno e anexar a pre-test-cache-key. Permite invalidar cache quando arquivos-fonte mudam (ex: dump SQL, lockfile). Aceita newline-separated. hashFiles nao funciona no `with:` do caller — por isso o reusable computa.'
        required: false
        type: string
        default: ''
      pre-test-cache-paths:
        description: 'Paths (newline-separated) cacheados por actions/cache. So usado se pre-test-cache-key != "".'
        required: false
        type: string
        default: ''
      pre-test-cache-restore-keys:
        description: 'restore-keys (newline-separated) do actions/cache. Opcional.'
        required: false
        type: string
        default: ''
      run-static-analysis:
        description: 'Roda phpstan/larastan (vendor/bin/phpstan analyse).'
        required: false
        type: boolean
        default: false
      run-code-style:
        description: 'Roda Pint (vendor/bin/pint --test).'
        required: false
        type: boolean
        default: false

      # ----- inputs repassados pro base.yml ----------------------------------
      image-name:        { required: true,  type: string }
      registry:          { required: true,  type: string }
      image-tag:         { required: false, type: string, default: '' }
      dockerfile:        { required: false, type: string, default: 'Dockerfile' }
      dockerfile-target: { required: false, type: string, default: '' }
      build-args:        { required: false, type: string, default: '' }
      build-context:     { required: false, type: string, default: '.' }
      platforms:         { required: false, type: string, default: 'linux/amd64' }
      do-push:           { required: false, type: boolean, default: true }
      block-on-failure:  { required: false, type: boolean, default: true }
      run-secrets-scan:    { required: false, type: boolean, default: true }
      run-vuln-scan:       { required: false, type: boolean, default: true }
      run-sast:            { required: false, type: boolean, default: true }
      run-dependency-scan: { required: false, type: boolean, default: true }
      semgrep-configs:   { required: false, type: string, default: 'p/owasp-top-ten p/php' }
      pr-report:         { required: false, type: boolean, default: true }
      notify-channel:    { required: false, type: string, default: 'none' }
      notify-on:         { required: false, type: string, default: 'failure' }
      slack-channel:     { required: false, type: string, default: '' }
      email-to:          { required: false, type: string, default: '' }
      docker-cache-mode: { required: false, type: string, default: 'gha' }
      docker-cache-ref:  { required: false, type: string, default: '' }
      auth-method:                { required: false, type: string, default: 'docker-login' }
      gcp-workload-identity-provider: { required: false, type: string, default: '' }
      gcp-service-account:        { required: false, type: string, default: '' }
      extra-registry-host:        { required: false, type: string, default: '' }
      extra-registry-username:    { required: false, type: string, default: '' }

    secrets:
      REGISTRY_USERNAME:           { required: false }
      REGISTRY_PASSWORD:           { required: false }
      EXTRA_REGISTRY_PASSWORD:     { required: false }
      PRE_TEST_REGISTRY_PASSWORD:  { required: false }
      SLACK_WEBHOOK_URL:    { required: false }
      SMTP_HOST:            { required: false }
      SMTP_PORT:            { required: false }
      SMTP_USERNAME:        { required: false }
      SMTP_PASSWORD:        { required: false }
      SMTP_FROM:            { required: false }

    outputs:
      image-ref:
        description: 'Referencia completa da imagem (registry/name:tag).'
        value: ${{ jobs.pipeline.outputs.image-ref }}
      build-pushed:
        description: 'true se build-push completou com sucesso.'
        value: ${{ jobs.pipeline.outputs.build-pushed }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Testes PHP
  # ---------------------------------------------------------------------------
  # Setup PHP via shivammathur/setup-php (action mais usada do ecossistema).
  # Cache do composer baseado em composer.lock. Testes rodam por ultimo.
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          coverage: none
          tools: composer:v2

      # Cache das deps do composer pra acelerar runs subsequentes.
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ inputs.php-version }}-

      - name: Install dependencies
        env:
          ARGS: ${{ inputs.composer-args }}
        # SC2086 intencional: ARGS contem multiplas flags separadas por espaco.
        run: |
          # shellcheck disable=SC2086
          composer install $ARGS

      # =====================================================================
      # Checks (composer audit, pint, phpstan, phpunit)
      # ---------------------------------------------------------------------
      # Cada check segue o padrao dos scans do base.yml:
      #   1. step de execucao com continue-on-error: true (captura exit code)
      #   2. step "summary" if: always() — escreve $GITHUB_STEP_SUMMARY e
      #      gera counts-<tool>.json (consumido pelo Report consolidado)
      #   3. upload do report + counts como artifacts (retention-days: 15)
      #   4. step final "Propagate job status" decide a cor do job em funcao
      #      do outcome agregado.
      # =====================================================================

      # ---------- Composer audit -------------------------------------------
      - name: Composer audit
        id: audit
        if: inputs.run-dependency-scan
        continue-on-error: true
        run: |
          set +e
          composer audit --no-dev --format=plain 2>&1 | tee audit-output.txt
          echo "${PIPESTATUS[0]}" > audit.exit
          exit "$(cat audit.exit)"

      - name: Composer audit summary
        if: always() && inputs.run-dependency-scan
        run: |
          set +e
          EXIT=$(cat audit.exit 2>/dev/null || echo 0)
          COUNT=$(grep -c '^Package: ' audit-output.txt 2>/dev/null || echo 0)
          {
            echo "## Composer audit"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Sem vulnerabilidades reportadas."
            else
              echo "**${COUNT} vulnerabilidade(s) reportada(s).**"
              echo ""
              echo '```'
              head -200 audit-output.txt
              echo '```'
            fi
            echo ""
            echo "> Artifact: \`composer-audit-report\`"
          } > audit-details.md
          cat audit-details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Dependency audit" \
            --arg status "$STATUS" \
            --arg summary "${COUNT} vulnerabilidade(s)" \
            --rawfile details audit-details.md \
            '{tool:$tool,status:$status,summary:$summary,details:$details}' \
            > counts-audit.json

      - name: Upload composer audit report
        if: always() && inputs.run-dependency-scan
        uses: actions/upload-artifact@v4
        with:
          name: composer-audit-report
          path: audit-output.txt
          retention-days: 15
          if-no-files-found: ignore

      - name: Upload composer audit counts
        if: always() && inputs.run-dependency-scan
        uses: actions/upload-artifact@v4
        with:
          name: counts-audit
          path: counts-audit.json
          retention-days: 15

      # ---------- Code style (Pint) ----------------------------------------
      - name: Code style (Pint)
        id: pint
        if: inputs.run-code-style
        continue-on-error: true
        run: |
          set +e
          vendor/bin/pint --test 2>&1 | tee pint-output.txt
          echo "${PIPESTATUS[0]}" > pint.exit
          exit "$(cat pint.exit)"

      - name: Pint summary
        if: always() && inputs.run-code-style
        run: |
          set +e
          EXIT=$(cat pint.exit 2>/dev/null || echo 0)
          COUNT=$(grep -cE '^\s*[⨯×]' pint-output.txt 2>/dev/null || echo 0)
          {
            echo "## Code style (Pint)"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Estilo OK."
            else
              echo "**${COUNT} arquivo(s) fora do padrao.**"
              echo ""
              echo '```'
              head -200 pint-output.txt
              echo '```'
            fi
            echo ""
            echo "> Artifact: \`pint-report\`"
          } > pint-details.md
          cat pint-details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Code style" \
            --arg status "$STATUS" \
            --arg summary "${COUNT} arquivo(s)" \
            --rawfile details pint-details.md \
            '{tool:$tool,status:$status,summary:$summary,details:$details}' \
            > counts-codestyle.json

      - name: Upload pint report
        if: always() && inputs.run-code-style
        uses: actions/upload-artifact@v4
        with:
          name: pint-report
          path: pint-output.txt
          retention-days: 15
          if-no-files-found: ignore

      - name: Upload pint counts
        if: always() && inputs.run-code-style
        uses: actions/upload-artifact@v4
        with:
          name: counts-codestyle
          path: counts-codestyle.json
          retention-days: 15

      # ---------- Static analysis (phpstan) --------------------------------
      - name: Static analysis (phpstan)
        id: phpstan
        if: inputs.run-static-analysis
        continue-on-error: true
        run: |
          set +e
          vendor/bin/phpstan analyse --no-progress --memory-limit=2G 2>&1 | tee phpstan-output.txt
          echo "${PIPESTATUS[0]}" > phpstan.exit
          exit "$(cat phpstan.exit)"

      - name: Phpstan summary
        if: always() && inputs.run-static-analysis
        run: |
          set +e
          EXIT=$(cat phpstan.exit 2>/dev/null || echo 0)
          # phpstan termina com linha "[ERROR] Found N errors" ou "[OK] No errors".
          COUNT=$(grep -oE 'Found [0-9]+ error' phpstan-output.txt | grep -oE '[0-9]+' | tail -1)
          [ -z "$COUNT" ] && COUNT=0
          {
            echo "## Static analysis (phpstan)"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Nenhum erro."
            else
              echo "**${COUNT} erro(s) reportado(s).**"
              echo ""
              echo '```'
              tail -200 phpstan-output.txt
              echo '```'
            fi
            echo ""
            echo "> Artifact: \`phpstan-report\`"
          } > phpstan-details.md
          cat phpstan-details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Static analysis" \
            --arg status "$STATUS" \
            --arg summary "${COUNT} erro(s)" \
            --rawfile details phpstan-details.md \
            '{tool:$tool,status:$status,summary:$summary,details:$details}' \
            > counts-phpstan.json

      - name: Upload phpstan report
        if: always() && inputs.run-static-analysis
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-report
          path: phpstan-output.txt
          retention-days: 15
          if-no-files-found: ignore

      - name: Upload phpstan counts
        if: always() && inputs.run-static-analysis
        uses: actions/upload-artifact@v4
        with:
          name: counts-phpstan
          path: counts-phpstan.json
          retention-days: 15

      # ---------- Tests (phpunit) ------------------------------------------
      # Cache + buildx opcionais ANTES do pre-test-command. Cobrem:
      #   - layers do `docker buildx build --cache-from/to type=gha` no setup
      #     (buildx setup exporta as envs do cache GHA).
      #   - datadir de mysql, fixtures, vendor extra etc via actions/cache.
      - name: Setup Buildx (pre-test)
        if: inputs.pre-test-setup-buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Login pra registry adicional usado pelo pre-test (imagens privadas em
      # docker compose, etc). Independente do extra-registry-* do base.yml,
      # ja que jobs nao compartilham docker auth.
      - name: Pre-test registry login
        if: inputs.pre-test-registry-host != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.pre-test-registry-host }}
          username: ${{ inputs.pre-test-registry-username }}
          password: ${{ secrets.PRE_TEST_REGISTRY_PASSWORD }}

      - name: Pre-test cache
        if: inputs.pre-test-cache-key != ''
        uses: actions/cache@v4
        with:
          # Compoe a key final. Se pre-test-cache-key-files != '', anexa o
          # hashFiles desses paths pra invalidar quando os arquivos mudam.
          key: ${{ inputs.pre-test-cache-key-files != '' && format('{0}-{1}', inputs.pre-test-cache-key, hashFiles(inputs.pre-test-cache-key-files)) || inputs.pre-test-cache-key }}
          path: ${{ inputs.pre-test-cache-paths }}
          restore-keys: ${{ inputs.pre-test-cache-restore-keys }}

      # pre-test-command roda antes do phpunit pra preparar o ambiente
      # (mysql/redis, fixtures, etc). Falha aqui aborta o step seguinte e
      # marca o outcome do phpunit como skipped no Propagate final.
      - name: Pre-test setup
        if: inputs.pre-test-command != ''
        env:
          PRE_CMD: ${{ inputs.pre-test-command }}
        run: bash -c "$PRE_CMD"

      - name: Run tests
        id: phpunit
        continue-on-error: true
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          set +e
          bash -c "$CMD" 2>&1 | tee phpunit-output.txt
          echo "${PIPESTATUS[0]}" > phpunit.exit
          exit "$(cat phpunit.exit)"

      - name: Phpunit summary
        if: always()
        run: |
          set +e
          EXIT=$(cat phpunit.exit 2>/dev/null || echo 0)
          # Tenta linhas tipo "Tests: 42, Assertions: 100, Failures: 3, Errors: 1".
          STATS=$(grep -oE 'Tests: [0-9]+.*' phpunit-output.txt | tail -1)
          [ -z "$STATS" ] && STATS=$(grep -oE 'OK \([0-9]+ tests?.*\)' phpunit-output.txt | tail -1)
          [ -z "$STATS" ] && STATS="(sem estatisticas)"
          {
            echo "## Tests (phpunit)"
            echo ""
            if [ "$EXIT" -eq 0 ]; then
              echo "Suite verde. ${STATS}"
            else
              echo "**Suite vermelha.** ${STATS}"
              echo ""
              echo '```'
              tail -200 phpunit-output.txt
              echo '```'
            fi
            echo ""
            echo "> Artifact: \`phpunit-report\`"
          } > phpunit-details.md
          cat phpunit-details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Tests" \
            --arg status "$STATUS" \
            --arg summary "$STATS" \
            --rawfile details phpunit-details.md \
            '{tool:$tool,status:$status,summary:$summary,details:$details}' \
            > counts-test.json

      - name: Upload phpunit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report
          path: phpunit-output.txt
          retention-days: 15
          if-no-files-found: ignore

      - name: Upload phpunit counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-test
          path: counts-test.json
          retention-days: 15

      # ---------- Propaga status ------------------------------------------
      # Job test fica vermelho se qualquer check tiver falhado. Os counts ja
      # subiram via if: always(), entao o Report consolidado ainda mostra
      # todos os tools mesmo com job test vermelho.
      - name: Propagate job status
        if: always()
        env:
          AUDIT_OUTCOME:    ${{ steps.audit.outcome }}
          PINT_OUTCOME:     ${{ steps.pint.outcome }}
          PHPSTAN_OUTCOME:  ${{ steps.phpstan.outcome }}
          PHPUNIT_OUTCOME:  ${{ steps.phpunit.outcome }}
        run: |
          fail=0
          for o in "$AUDIT_OUTCOME" "$PINT_OUTCOME" "$PHPSTAN_OUTCOME" "$PHPUNIT_OUTCOME"; do
            if [ "$o" = "failure" ]; then
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

  # ===========================================================================
  # Pipeline (chama base.yml)
  # ---------------------------------------------------------------------------
  # needs: test + if: always() => pipeline roda mesmo com test falho, garantindo
  # que scans paralelos + Report consolidado sempre gerem feedback no PR.
  # `tests-passed` propaga o resultado do test pro `base.yml`, que usa esse gate
  # adicional pra impedir build-push quando o test falhou.
  # secrets: inherit repassa todos os secrets do caller pro base.
  # ===========================================================================
  pipeline:
    name: Pipeline
    needs: test
    if: always() && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    uses: ./.github/workflows/base.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read         # required by the nested pr-report job in base.yml
    with:
      image-name:          ${{ inputs.image-name }}
      registry:            ${{ inputs.registry }}
      image-tag:           ${{ inputs.image-tag }}
      dockerfile:          ${{ inputs.dockerfile }}
      dockerfile-target:   ${{ inputs.dockerfile-target }}
      build-args:          ${{ inputs.build-args }}
      build-context:       ${{ inputs.build-context }}
      platforms:           ${{ inputs.platforms }}
      do-push:             ${{ inputs.do-push }}
      block-on-failure:    ${{ inputs.block-on-failure }}
      tests-passed:        ${{ needs.test.result == 'success' }}
      run-secrets-scan:    ${{ inputs.run-secrets-scan }}
      run-vuln-scan:       ${{ inputs.run-vuln-scan }}
      run-sast:            ${{ inputs.run-sast }}
      run-dependency-scan: ${{ inputs.run-dependency-scan }}
      semgrep-configs:     ${{ inputs.semgrep-configs }}
      pr-report:           ${{ inputs.pr-report }}
      notify-channel:      ${{ inputs.notify-channel }}
      notify-on:           ${{ inputs.notify-on }}
      slack-channel:       ${{ inputs.slack-channel }}
      email-to:            ${{ inputs.email-to }}
      docker-cache-mode:   ${{ inputs.docker-cache-mode }}
      docker-cache-ref:    ${{ inputs.docker-cache-ref }}
      auth-method:                    ${{ inputs.auth-method }}
      gcp-workload-identity-provider: ${{ inputs.gcp-workload-identity-provider }}
      gcp-service-account:            ${{ inputs.gcp-service-account }}
      extra-registry-host:            ${{ inputs.extra-registry-host }}
      extra-registry-username:        ${{ inputs.extra-registry-username }}
