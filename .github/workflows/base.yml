# ============================================================================
# base.yml — pipeline reusable da Widesoftware.
#
# Fonte: widesoftware-dev/github-workflows (publico, cross-org sem PAT).
# Consumidores chamam via `uses: widesoftware-dev/github-workflows/.github/
# workflows/base.yml@vX.Y.Z` em PRs e pushes para main/homolog.
#
# Etapas (rodam em paralelo onde possivel):
#   1. secrets-scan      — gitleaks no historico do repo
#   2. sast              — Semgrep (configs parametrizaveis)
#   3. vuln-scan-fs      — Trivy FS (CVE em arquivos de manifesto, vendor/...)
#   4. vuln-scan-config  — Trivy Config (Dockerfile/IaC misconfig)
#   5. build-push        — docker buildx + push condicional ao registry
#   6. container-scan    — Trivy image na imagem buildada (gate final)
#   7. pr-report         — comenta no PR em caso de falha (opcional)
#   8. notify            — Slack/email no final (opcional)
#
# IMPORTANTE: este workflow NAO faz deploy. O deploy de todos os clientes
# acontece via ArgoCD observando o registry. Push da imagem = sinal pro
# ArgoCD aplicar a nova versao no cluster.
#
# Controle de bloqueio (block-on-failure):
#   true  — qualquer scan falhando bloqueia build/push. Usar em `main`.
#   false — scans rodam, falhas viram warning, build/push segue.
#           Usar em `homolog` pra permitir entregar mesmo com debito de
#           seguranca, enquanto o time arruma.
#   Padrao no caller: block-on-failure: ${{ github.ref == 'refs/heads/main' }}
#
# Seguranca:
#   - Toda input usada em `run:` passa por `env:` (evita workflow injection).
#   - Secrets do registry sao opcionais (so exigidos quando `do-push: true`).
#   - Slack/SMTP: skip silencioso se nao configurado, sem quebrar o workflow.
# ============================================================================
name: Base pipeline

on:
  workflow_call:
    inputs:
      # ----- imagem / registry -------------------------------------------------
      image-name:
        description: 'Nome curto da imagem (ex: meu-app). Compor o ref final como `<registry>/<image-name>:<tag>`.'
        required: true
        type: string
      registry:
        description: 'Host do registry alvo (ex: registry.cliente.com.br ou ghcr.io/cliente).'
        required: true
        type: string
      image-tag:
        description: 'Tag da imagem. Vazio = usa SHA curto (7 chars) do commit.'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Caminho do Dockerfile relativo ao repo do consumidor.'
        required: false
        type: string
        default: 'Dockerfile'
      dockerfile-target:
        description: 'Stage final do Dockerfile multi-stage. Vazio = builda ate a ultima stage.'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Build args, um por linha no formato KEY=value. Repassado direto ao docker/build-push-action.'
        required: false
        type: string
        default: ''
      build-context:
        description: 'Diretorio do build context.'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Plataformas alvo do buildx (ex: linux/amd64,linux/arm64). Multi-arch precisa de QEMU; configurar se necessario.'
        required: false
        type: string
        default: 'linux/amd64'

      # ----- controle de fluxo ------------------------------------------------
      do-push:
        description: 'true = autentica no registry e faz push. false = builda local (para validar Dockerfile sem publicar).'
        required: false
        type: boolean
        default: true
      block-on-failure:
        description: 'true = falha de scan bloqueia build/push. false = warning only (homolog).'
        required: false
        type: boolean
        default: true
      tests-passed:
        description: 'Sinaliza se a suite de testes do caller passou. Wrappers (php/node/go) propagam needs.test.result; quando false, build-push e skipped mas scans + Report ainda rodam pra dar visibilidade no PR. Default true mantem compat com callers que nao passam o flag.'
        required: false
        type: boolean
        default: true

      # ----- toggles de seguranca ---------------------------------------------
      # Cada toggle pode ser desligado individualmente. Clientes legados
      # comecam com algumas em false e vao reativando aos poucos.
      run-secrets-scan:
        description: 'Roda gitleaks (busca segredos vazados no historico).'
        required: false
        type: boolean
        default: true
      run-vuln-scan:
        description: 'Roda Trivy FS + Trivy Config (CVE em manifestos + misconfig em Dockerfile/IaC).'
        required: false
        type: boolean
        default: true
      run-sast:
        description: 'Roda Semgrep SAST (analise estatica de padroes inseguros).'
        required: false
        type: boolean
        default: true
      run-dependency-scan:
        description: 'Roda dependency scan. Implementado nos wrappers (php.yml usa composer audit, node.yml usa yarn npm audit). Sem efeito no base.yml.'
        required: false
        type: boolean
        default: true

      # ----- Semgrep ----------------------------------------------------------
      semgrep-configs:
        description: 'Configs Semgrep separadas por espaco (ex: "p/owasp-top-ten p/php"). Sem caracteres especiais.'
        required: false
        type: string
        default: 'p/owasp-top-ten'

      # ----- relatorio / notificacao ------------------------------------------
      pr-report:
        description: 'Posta comentario consolidado de falhas no PR.'
        required: false
        type: boolean
        default: true
      notify-channel:
        description: 'Canal de notificacao: none | slack | email | both.'
        required: false
        type: string
        default: 'none'
      notify-on:
        description: 'Quando notificar: failure | always.'
        required: false
        type: string
        default: 'failure'
      slack-channel:
        description: 'Nome do canal Slack (ex: #ci-cliente-a). Opcional — depende do webhook estar configurado para canal especifico ou aceitar override.'
        required: false
        type: string
        default: ''
      email-to:
        description: 'Destinatarios de email separados por virgula.'
        required: false
        type: string
        default: ''

      # ----- autenticacao no registry -----------------------------------------
      # docker-login (padrao): usuario/senha em secrets REGISTRY_USERNAME/PASSWORD.
      # gcp-wif: OIDC via Workload Identity Federation. Caller precisa permitir
      # `id-token: write` e setar gcp-workload-identity-provider + gcp-service-account.
      auth-method:
        description: 'Metodo de auth no registry: docker-login | gcp-wif.'
        required: false
        type: string
        default: 'docker-login'
      gcp-workload-identity-provider:
        description: 'WIF provider full path (projects/.../providers/...). So usado se auth-method=gcp-wif.'
        required: false
        type: string
        default: ''
      gcp-service-account:
        description: 'Email da service account GCP. So usado se auth-method=gcp-wif.'
        required: false
        type: string
        default: ''

      # Cargo audit foi extraido pra composite action — chame
      # widesoftware-dev/github-workflows/.github/actions/cargo-audit@<tag>
      # em um job proprio do caller. Razao: so monorepos com Rust precisam,
      # e job skipped no reusable poluia a sidebar de todos os outros.

      # GitOps bump nao vive mais aqui — usar a composite action
      # widesoftware-dev/github-workflows/.github/actions/gitops-bump@<tag>
      # em um job proprio do caller. Reusable workflow cross-org nao recebe
      # organization secrets, e composite actions sim (rodam no job do caller).

      # ----- Docker cache mode (v1.9.0+) -------------------------------------
      # gha      = GitHub Actions cache (default, 10GB cap, isolado por branch).
      # registry = cache no proprio registry (precisa docker-cache-ref).
      #            Sem cap, compartilhado entre branches, sem latencia HTTPS.
      # both     = grava nos dois, le do mais quente.
      docker-cache-mode:
        description: 'Modo de cache do Docker buildx: gha | registry | both.'
        required: false
        type: string
        default: 'gha'
      docker-cache-ref:
        description: 'Ref do cache no registry, usado quando docker-cache-mode inclui registry (ex: <host>/<project>/<repo>-cache). Vazio = derivado de <registry>:cache.'
        required: false
        type: string
        default: ''

    # Secrets sao `required: false` no nivel do workflow porque alguns clientes
    # nao usam push (do-push: false) ou nao usam Slack/email. A validacao real
    # acontece dentro dos jobs (`if:`, ou skip silencioso).
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      SMTP_FROM:
        required: false
    outputs:
      image-ref:
        description: 'Referencia completa da imagem (registry/name:tag). Util pro caller encadear jobs adicionais.'
        value: ${{ jobs.build-push.outputs.image-ref }}
      build-pushed:
        description: '"true" se build-push completou com sucesso E do-push era true. Caller usa pra decidir se ja roda gitops mesmo com scans falhando.'
        value: ${{ jobs.build-push.outputs.build-pushed }}

# Permissoes minimas necessarias:
#   contents: read         — checkout
# #   pull-requests: write   — comentar no PR (pr-report)
#   id-token: write        — OIDC pra Workload Identity Federation (auth-method=gcp-wif)
permissions:
  contents: read
  pull-requests: write
  id-token: write

# Silencia warnings de actions ainda em Node 20. GitHub forca Node 24
# em 2026-06-02; setar isso agora antecipa o comportamento e remove o ruido
# dos logs sem precisar bumpar versao de cada action individualmente.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancela runs anteriores na mesma ref (PR ou branch) quando vier push novo.
concurrency:
  group: base-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. SECRETS SCAN — gitleaks
  # ---------------------------------------------------------------------------
  # Procura segredos (API keys, tokens, certificados) commitados no historico.
  # fetch-depth: 0 garante que o gitleaks veja todo o historico, nao so o HEAD.
  # ===========================================================================
  secrets-scan:
    name: Secrets scan
    if: inputs.run-secrets-scan
    # bumped de 5 -> 15 pra acomodar repos legados/grandes onde gitleaks
    # precisa varrer historico extenso (medico24hs ultrapassou os 5min).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: gitleaks/gitleaks
          tag: latest
          chmod: 0755

      - name: Run gitleaks
        id: scan
        continue-on-error: true
        run: gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json --exit-code 1

      - name: Render summary
        if: always()
        run: |
          set +e
          FINDINGS=0
          if [ -s gitleaks-report.json ]; then
            FINDINGS=$(jq 'length' gitleaks-report.json 2>/dev/null || echo 0)
          fi
          {
            echo "## Gitleaks"
            echo ""
            if [ "$FINDINGS" -eq 0 ]; then
              echo "Nenhum segredo detectado."
            else
              echo "**${FINDINGS} segredo(s) detectado(s).** Remover do historico antes do merge."
              echo ""
              echo "| Arquivo | Linha | Regra | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| `\(.File)` | \(.StartLine) | `\(.RuleID)` | `\(.Commit[0:7])` |"' gitleaks-report.json | head -50
            fi
            echo ""
            echo "> Artifact: \`gitleaks-report\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$FINDINGS" -gt 0 ] && STATUS=failure
          jq -n \
            --arg tool "Gitleaks" \
            --arg status "$STATUS" \
            --arg summary "${FINDINGS} segredo(s)" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-gitleaks.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-gitleaks
          path: counts-gitleaks.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # 2. SAST — Semgrep
  # ---------------------------------------------------------------------------
  # Roda dentro do container oficial do Semgrep. As configs sao parametrizaveis
  # pra permitir wrappers especializados (php.yml adiciona p/php, node.yml
  # adiciona p/typescript+p/react).
  # ===========================================================================
  sast:
    name: SAST (Semgrep)
    if: inputs.run-sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep
        id: scan
        continue-on-error: true
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
        run: |
          set +e
          set --
          for cfg in $SEMGREP_CONFIGS; do
            set -- "$@" --config "$cfg"
          done
          semgrep scan "$@" --severity ERROR --error --sarif --output semgrep.sarif
          echo "$?" > semgrep.exit
          exit "$(cat semgrep.exit)"

      - name: Render summary
        if: always()
        run: |
          set +e
          EXIT=$(cat semgrep.exit 2>/dev/null || echo 0)
          FINDINGS=0
          if [ -s semgrep.sarif ]; then
            FINDINGS=$(jq '[.runs[]?.results[]?] | length' semgrep.sarif 2>/dev/null || echo 0)
          fi
          {
            echo "## Semgrep SAST"
            echo ""
            if [ "$FINDINGS" -eq 0 ] && [ "$EXIT" -eq 0 ]; then
              echo "Nenhuma vulnerabilidade ERROR nas regras configuradas."
            else
              echo "**${FINDINGS} achado(s) com severidade ERROR.**"
              echo ""
              echo "| Regra | Arquivo | Linha |"
              echo "|---|---|---|"
              jq -r '[.runs[]? | .results[]? as $r | {rule: ($r.ruleId // "?"), file: ($r.locations[0].physicalLocation.artifactLocation.uri // "?"), line: ($r.locations[0].physicalLocation.region.startLine // 0)}] | .[:20][] | "| `\(.rule)` | `\(.file)` | \(.line) |"' semgrep.sarif 2>/dev/null || true
            fi
            echo ""
            echo "> Artifact: \`semgrep-report\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "$EXIT" -ne 0 ] && STATUS=failure
          jq -n \
            --arg tool "Semgrep SAST" \
            --arg status "$STATUS" \
            --arg summary "${FINDINGS} achado(s)" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-sast.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-sast
          path: counts-sast.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # 3. VULN SCAN FS — Trivy FS
  # ---------------------------------------------------------------------------
  # Escaneia manifestos (composer.lock, yarn.lock, package-lock.json) por CVE.
  # ignore-unfixed: ignora CVEs sem patch disponivel — nao acionavel.
  # ===========================================================================
  vuln-scan-fs:
    name: Vuln scan (Trivy FS)
    if: inputs.run-vuln-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Trivy FS
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: node_modules,dist,.git,.yarn,vendor
        continue-on-error: true

      - name: Render summary
        if: always()
        run: |
          set +e
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs.json 2>/dev/null || echo 0)
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json 2>/dev/null || echo 0)
          TOTAL=$((HIGH + CRIT))
          {
            echo "## Trivy FS"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "Nenhuma vulnerabilidade HIGH/CRITICAL nos manifestos."
            else
              echo "**${TOTAL} vulnerabilidade(s)** (HIGH=${HIGH}, CRITICAL=${CRIT})."
              echo ""
              echo "| Severidade | CVE | Pacote | Versão | Fixed |"
              echo "|---|---|---|---|---|"
              jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | .[:20][] | "| \(.Severity) | `\(.VulnerabilityID)` | `\(.PkgName)` | `\(.InstalledVersion)` | `\(.FixedVersion // "—")` |"' trivy-fs.json 2>/dev/null || true
            fi
            echo ""
            echo "> Artifact: \`trivy-fs-report\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "${{ steps.scan.outcome }}" = "failure" ] && STATUS=failure
          jq -n \
            --arg tool "Trivy FS" \
            --arg status "$STATUS" \
            --arg summary "${TOTAL} HIGH/CRITICAL" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-trivy-fs.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-trivy-fs
          path: counts-trivy-fs.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # 4. VULN SCAN CONFIG — Trivy Config
  # ---------------------------------------------------------------------------
  # Verifica boas praticas em Dockerfile (USER root, latest tag, etc.) e em
  # arquivos IaC (Terraform, k8s, etc., se houverem).
  # ===========================================================================
  vuln-scan-config:
    name: Vuln scan (Trivy Config)
    if: inputs.run-vuln-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Trivy Config
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-config.json
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: node_modules,dist,.git,.yarn,vendor
        continue-on-error: true

      - name: Render summary
        if: always()
        run: |
          set +e
          TOTAL=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-config.json 2>/dev/null || echo 0)
          {
            echo "## Trivy Config"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "Nenhum misconfig HIGH/CRITICAL em Dockerfile/IaC."
            else
              echo "**${TOTAL} misconfig(s) HIGH/CRITICAL.**"
              echo ""
              echo "| Severidade | ID | Arquivo | Titulo |"
              echo "|---|---|---|---|"
              jq -r '[.Results[]? as $r | $r.Misconfigurations[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | {sev: .Severity, id: .ID, file: $r.Target, msg: .Title}] | .[:20][] | "| \(.sev) | `\(.id)` | `\(.file)` | \(.msg) |"' trivy-config.json 2>/dev/null || true
            fi
            echo ""
            echo "> Artifact: \`trivy-config-report\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "${{ steps.scan.outcome }}" = "failure" ] && STATUS=failure
          jq -n \
            --arg tool "Trivy Config" \
            --arg status "$STATUS" \
            --arg summary "${TOTAL} misconfig(s)" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-trivy-config.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.json
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-trivy-config
          path: counts-trivy-config.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # 5. BUILD & PUSH
  # ---------------------------------------------------------------------------
  # Depende dos scans anteriores. O `if:` decide se roda:
  #   block-on-failure=false -> sempre roda (independente do resultado dos scans)
  #   block-on-failure=true  -> so roda se todos scans terminaram success/skipped
  #
  # Cache do GHA scopado por nome de imagem evita conflito entre projetos.
  # Push so acontece se do-push=true. Em PRs de validacao, do-push pode ser
  # false pra apenas validar que o Dockerfile builda.
  # ===========================================================================
  build-push:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - secrets-scan
      - sast
      - vuln-scan-fs
      - vuln-scan-config
    if: |
      always() &&
      inputs.tests-passed &&
      (
        inputs.block-on-failure == false ||
        (
          (needs.secrets-scan.result == 'success' || needs.secrets-scan.result == 'skipped') &&
          (needs.sast.result == 'success'         || needs.sast.result == 'skipped') &&
          (needs.vuln-scan-fs.result == 'success' || needs.vuln-scan-fs.result == 'skipped') &&
          (needs.vuln-scan-config.result == 'success' || needs.vuln-scan-config.result == 'skipped')
        )
      )
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
      build-pushed: ${{ steps.pushed.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: meta
        # Compoe o ref final. Se image-tag vazio, usa SHA curto.
        env:
          INPUT_TAG: ${{ inputs.image-tag }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          IMAGE_REF="${INPUT_REGISTRY}/${INPUT_IMAGE_NAME}:${TAG}"
          {
            echo "tag=${TAG}"
            echo "image-ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_REF}"

      # driver: docker-container habilita cache GHA e multi-plataforma.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Auth no registry. Dois modos:
      #   docker-login (padrao) — user/password via secrets.
      #   gcp-wif               — OIDC -> access token GCP -> docker login.
      #
      # IMPORTANTE: o registry input pode incluir path (ex:
      # 'host/project/repo-prod'). docker/login-action registra a auth na
      # CHAVE EXATA que voce passar, e o trivy/docker pull procuram pela
      # CHAVE DO HOST RAIZ. Logar no path completo faz funcionar push, mas
      # quebra pull (trivy nao encontra a auth). Extraimos o host raiz.
      - name: Resolve registry host
        id: registry-host
        env:
          REGISTRY: ${{ inputs.registry }}
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Auth GCP (WIF)
        id: gcp-auth
        if: inputs.do-push && inputs.auth-method == 'gcp-wif'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}

      - name: Registry login (GCP)
        if: inputs.do-push && inputs.auth-method == 'gcp-wif'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry-host.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Registry login (user/password)
        if: inputs.do-push && inputs.auth-method == 'docker-login'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry-host.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Resolve cache-from/cache-to multilinha baseado em docker-cache-mode.
      # Inputs em multilinha YAML aceitam string com \n separando entradas.
      - name: Resolve docker cache
        id: dcache
        env:
          MODE: ${{ inputs.docker-cache-mode }}
          REF_INPUT: ${{ inputs.docker-cache-ref }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -e
          FROM=""
          TO=""
          # GHA cache
          case "$MODE" in
            gha|both)
              FROM="${FROM}type=gha,scope=${IMAGE_NAME}"$'\n'
              TO="${TO}type=gha,scope=${IMAGE_NAME},mode=max"$'\n'
              ;;
          esac
          # Registry cache
          case "$MODE" in
            registry|both)
              REF="$REF_INPUT"
              [ -z "$REF" ] && REF="${REGISTRY}/${IMAGE_NAME}-cache"
              FROM="${FROM}type=registry,ref=${REF}"$'\n'
              TO="${TO}type=registry,ref=${REF},mode=max"$'\n'
              ;;
          esac
          {
            echo "from<<EOF"
            printf '%s' "$FROM"
            echo "EOF"
            echo "to<<EOF"
            printf '%s' "$TO"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # load: true (quando push=false) carrega a imagem no daemon local
      # — util pra debug ou pra rodar testes contra o container localmente.
      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.dockerfile-target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.do-push }}
          load: ${{ !inputs.do-push }}
          tags: ${{ steps.meta.outputs.image-ref }}
          build-args: ${{ inputs.build-args }}
          cache-from: ${{ steps.dcache.outputs.from }}
          cache-to: ${{ steps.dcache.outputs.to }}

      # Setado APENAS se build-push subiu efetivamente uma imagem. Caller usa
      # esse output pra decidir se pode rodar gitops bump mesmo quando scans
      # individuais falharam (cenario homolog block-on-failure=false).
      - name: Mark build pushed
        id: pushed
        if: inputs.do-push
        run: echo "value=true" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # 6. CONTAINER SCAN — Trivy image
  # ---------------------------------------------------------------------------
  # Escaneia a imagem ja publicada. Faz login no registry pra puxar a imagem.
  # E o gate final antes da imagem ser efetivamente promovida.
  # ===========================================================================
  container-scan:
    name: Container scan
    # So roda se imagem foi efetivamente pushada (do-push=true E build success).
    # Em PR validation com do-push=false, nao existe imagem no registry pra trivy
    # puxar — alem disso, sem skip aqui o trivy retorna MANIFEST_UNKNOWN.
    if: always() && needs.build-push.outputs.build-pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-push
    steps:
      - uses: actions/checkout@v6

      - name: Resolve registry host
        id: registry-host
        env:
          REGISTRY: ${{ inputs.registry }}
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Auth GCP (WIF)
        id: gcp-auth
        if: inputs.auth-method == 'gcp-wif'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}

      - name: Registry login (GCP)
        if: inputs.auth-method == 'gcp-wif'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry-host.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Registry login (user/password)
        if: inputs.auth-method == 'docker-login'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Trivy image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-push.outputs.image-ref }}
          format: json
          output: trivy-image.json
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
        continue-on-error: true

      - name: Render summary
        if: always()
        run: |
          set +e
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-image.json 2>/dev/null || echo 0)
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image.json 2>/dev/null || echo 0)
          TOTAL=$((HIGH + CRIT))
          {
            echo "## Container scan (Trivy image)"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "Nenhuma vulnerabilidade HIGH/CRITICAL na imagem."
            else
              echo "**${TOTAL} vulnerabilidade(s)** (HIGH=${HIGH}, CRITICAL=${CRIT})."
              echo ""
              echo "| Severidade | CVE | Pacote | Versão | Fixed |"
              echo "|---|---|---|---|---|"
              jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | .[:20][] | "| \(.Severity) | `\(.VulnerabilityID)` | `\(.PkgName)` | `\(.InstalledVersion)` | `\(.FixedVersion // "—")` |"' trivy-image.json 2>/dev/null || true
            fi
            echo ""
            echo "> Artifact: \`trivy-image-report\`"
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          STATUS=success
          [ "${{ steps.scan.outcome }}" = "failure" ] && STATUS=failure
          jq -n \
            --arg tool "Container scan" \
            --arg status "$STATUS" \
            --arg summary "${TOTAL} HIGH/CRITICAL" \
            --rawfile details details.md \
            '{tool: $tool, status: $status, summary: $summary, details: $details}' \
            > counts-container-scan.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          retention-days: 15

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counts-container-scan
          path: counts-container-scan.json
          retention-days: 7

      - name: Propagate status
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1

  # GitOps bump foi extraido pra uma composite action — chame
  # widesoftware-dev/github-workflows/.github/actions/gitops-bump@<tag>
  # em um job proprio do caller. Razao: reusable workflow cross-org nao
  # recebe organization secrets do caller; composite action recebe.

  # ===========================================================================
  # 7. REPORT
  # ---------------------------------------------------------------------------
  # Roda SEMPRE no fim do pipeline (qualquer status). Gera:
  #   - Step Summary no run (visivel em qualquer evento — tag, push, PR).
  #   - Comentario no PR (so quando event_name == 'pull_request').
  #
  # Marker HTML no comentario garante idempotencia: re-runs editam o mesmo
  # comentario em vez de criar novos.
  # ===========================================================================
  pr-report:
    name: Report
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast
      - vuln-scan-fs
      - vuln-scan-config
      - build-push
      - container-scan
    if: always() && inputs.pr-report
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Pega counts-<tool>.json gerados por cada job (scan/test/etc).
      - name: Download counts artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: counts-*
          merge-multiple: true
          path: counts

      - name: Consolidate report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;

            const countsDir = 'counts';
            const counts = {};
            if (fs.existsSync(countsDir)) {
              for (const file of fs.readdirSync(countsDir)) {
                try {
                  const data = JSON.parse(fs.readFileSync(path.join(countsDir, file), 'utf8'));
                  counts[data.tool] = data;
                } catch (e) { /* skip malformado */ }
              }
            }

            const ORDER = [
              'Gitleaks',
              'Dependency audit',
              'Lint',
              'Code style',
              'Typecheck',
              'Static analysis',
              'Tests',
              'Semgrep SAST',
              'Trivy FS',
              'Trivy Config',
              'Cargo audit',
              'Container scan',
            ];
            const icon = (s) => ({
              success: '✅', failure: '❌',
              cancelled: '⏹️', skipped: '⏭️',
            }[s] || '❓');

            const present = ORDER.filter(t => counts[t]);
            const rows = present.map(t => {
              const c = counts[t];
              return `| ${icon(c.status)} | **${t}** | ${c.summary || '—'} |`;
            }).join('\n');

            const failed = present
              .map(t => counts[t])
              .filter(c => c.status === 'failure' && c.details);

            const truncate = (s, lim = 6000) =>
              s.length > lim ? s.slice(0, lim) + '\n\n_…truncado. Ver artifact._' : s;

            const detailsBlocks = failed.map(c => [
              '<details open>',
              `<summary>❌ <strong>${c.tool}</strong> — ${c.summary}</summary>`,
              '',
              truncate(c.details).trim(),
              '',
              '</details>',
            ].join('\n')).join('\n\n');

            const sha7 = context.sha.substring(0, 7);
            const header = failed.length > 0
              ? `## ❌ CI falhou — ${failed.length} tool(s) com problemas`
              : '## ✅ CI verde';

            const bodyLines = [
              header,
              '',
              `Commit \`${sha7}\` · [ver run completo](${runUrl})`,
              '',
              '| | Tool | Achados |',
              '|---|---|---|',
              rows,
              '',
              detailsBlocks ? '### Detalhes\n\n' + detailsBlocks : '',
            ].filter(Boolean);

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, bodyLines.join('\n') + '\n');

            if (context.eventName !== 'pull_request') {
              core.info('Nao e um PR event — comentario pulado; report no step summary.');
              return;
            }

            const marker = '<!-- ci-report -->';
            const commentBody = [
              marker,
              ...bodyLines,
              '',
              '<sub>Comentario auto-atualizado por `widesoftware-dev/github-workflows`. Artifacts (.json/.log) disponiveis no run por 15 dias.</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c =>
              c.body && (c.body.includes(marker) || c.body.includes('<!-- ci-failure-report -->'))
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body: commentBody,
              });
            }

  # ===========================================================================
  # 8. NOTIFY
  # ---------------------------------------------------------------------------
  # Roda no final independente do status (always()). Decide se notifica via:
  #   notify-on=failure  — so se algum job acima falhou
  #   notify-on=always   — sempre
  #
  # Skip silencioso quando credenciais nao configuradas:
  #   Slack sem SLACK_WEBHOOK_URL  -> log informativo, sai sem erro.
  #   Email sem SMTP_*             -> step pulado (if checa SMTP_HOST).
  # ===========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast
      - vuln-scan-fs
      - vuln-scan-config
      - build-push
      - container-scan
    if: |
      always() &&
      inputs.notify-channel != 'none' &&
      (
        inputs.notify-on == 'always' ||
        contains(needs.*.result, 'failure')
      )
    steps:
      - name: Compute status
        id: status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: inputs.notify-channel == 'slack' || inputs.notify-channel == 'both'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          EMOJI: ${{ steps.status.outputs.emoji }}
          SLACK_CHANNEL: ${{ inputs.slack-channel }}
        # Skip silencioso: se webhook nao foi configurado, registra warning
        # mas nao quebra o run. Util quando ativa Slack gradualmente.
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL nao configurado — pulando notificacao Slack."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="${EMOJI} *${GITHUB_REPOSITORY}* — ${STATUS} em \`${GITHUB_REF_NAME}\` por *${GITHUB_ACTOR}* (<${RUN_URL}|ver run>)"
          PAYLOAD=$(jq -n \
            --arg ch    "$SLACK_CHANNEL" \
            --arg text  "$TEXT" \
            '{channel: ($ch | select(. != "")), text: $text} | with_entries(select(.value != null))')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      # Check de SMTP via env (o `secrets` context nao funciona consistentemente
      # em `if:` de steps). Output `enabled` controla os steps seguintes.
      - name: Check SMTP config
        id: smtp-check
        if: inputs.notify-channel == 'email' || inputs.notify-channel == 'both'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: |
          if [ -n "$SMTP_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SMTP_HOST nao configurado — pulando notificacao por email."
          fi

      - name: Notify Email
        if: steps.smtp-check.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ inputs.email-to }}
          subject: "[${{ steps.status.outputs.status }}] ${{ github.repository }} @ ${{ github.ref_name }}"
          body: |
            Status: ${{ steps.status.outputs.status }}
            Repo: ${{ github.repository }}
            Branch/Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

