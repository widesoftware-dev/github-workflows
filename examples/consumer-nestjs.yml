# ============================================================================
# Exemplo de consumidor NestJS.
#
# Estrutura:
#   - Job `ci`        -> reusable workflow node.yml (scans, lint, test, build, push).
#   - Job `gitops`    -> composite action gitops-bump (atualiza kustomization no
#                        repo de ops). Roda DEPOIS do ci, em tag v* ou push homolog.
#
# Por que `gitops` e um job no caller (e nao parte do reusable):
#   Reusable workflows em outra organizacao NAO recebem organization secrets
#   do caller (mesmo via 'secrets: inherit'). Composite actions rodam no mesmo
#   job do caller, entao secrets sao passados como inputs normais. Como o
#   GitHub App private key vive no nivel da org, mantemos a composite action.
#
# Copie para `.github/workflows/ci.yml` no repo da aplicacao.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
    tags: ['v*']

permissions:
  contents: read
  id-token: write       # required when auth-method: gcp-wif
  pull-requests: write  # required for pr-report comments
  actions: read         # required to read run metadata in pr-report (drop if pr-report is disabled)

jobs:
  ci:
    uses: widesoftware-dev/github-workflows/.github/workflows/node.yml@v1.7.0
    secrets: inherit
    with:
      # image-name = <repo>-<env>.
      image-name: >-
        ${{
          startsWith(github.ref, 'refs/tags/v')
            && format('{0}-prod', github.event.repository.name)
            || format('{0}-homolog', github.event.repository.name)
        }}
      registry: >-
        ${{
          startsWith(github.ref, 'refs/tags/v')
            && format('<host>/<project>/{0}-prod', github.event.repository.name)
            || format('<host>/<project>/{0}-homolog', github.event.repository.name)
        }}
      image-tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.run_id }}
      do-push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/homolog') }}
      block-on-failure: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' }}

      node-version: '22'
      package-manager: 'pnpm'
      # pnpm-version: '9'   # opcional; default vazio = lê de package.json#packageManager. Setar conflita se já tem packageManager.
      lint-command: 'pnpm lint'
      typecheck-command: 'pnpm tsc --noEmit'
      test-command: 'pnpm test'

      semgrep-configs: 'p/owasp-top-ten p/typescript p/nodejs'
      # cargo-audit-paths: 'blockchain'

      # auth-method: 'gcp-wif'
      # gcp-workload-identity-provider: 'projects/123/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      # gcp-service-account: 'sa-name@projeto.iam.gserviceaccount.com'

      notify-channel: slack
      notify-on: failure
      slack-channel: '#ci-cliente-a'

  # GitOps bump roda em tag v* (env=prod) ou push em homolog (env=homolog).
  # Composite action recebe a private key como input — secrets do caller
  # acessiveis direto, sem o gargalo cross-org dos reusable workflows.
  gitops:
    needs: ci
    # Roda quando a imagem foi efetivamente pushada, mesmo se algum scan
    # falhou (em homolog o build segue mesmo com red). Sem isso, devs nao
    # conseguem deployar enquanto resolvem debitos de seguranca.
    if: |
      always() &&
      needs.ci.outputs.build-pushed == 'true' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/homolog')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: widesoftware-dev/github-workflows/.github/actions/gitops-bump@v1.7.0
        with:
          gitops-repo: 'org/microservice-ops'
          app-id: ${{ vars.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          image-name: >-
            ${{
              startsWith(github.ref, 'refs/tags/v')
                && format('{0}-prod', github.event.repository.name)
                || format('{0}-homolog', github.event.repository.name)
            }}
          image-tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.run_id }}
          # path-template: '{repo}-{env}/kustomization.yaml'  # default ok pra convencao Widesoftware
