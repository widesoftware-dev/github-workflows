# ============================================================================
# Exemplo de consumidor NestJS.
#
# Reusa o node.yml com defaults proprios de Nest: lint via eslint,
# testes unit + e2e (separados por comando), pnpm como package manager.
#
# Copie para `.github/workflows/ci.yml` no repo da aplicacao.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]

# Caller defines the upper bound of permissions for any reusable workflow.
# Without this block, the reusable runs with read-only defaults and fails to
# authenticate via WIF or post PR-report comments.
permissions:
  contents: read
  id-token: write       # required when auth-method: gcp-wif
  pull-requests: write  # required for pr-report comments
  packages: write       # required to push to ghcr.io (drop if not using)
  actions: read         # required to read run metadata in pr-report (drop if pr-report is disabled)

jobs:
  ci:
    uses: widesoftware-dev/github-workflows/.github/workflows/node.yml@v1.4.0
    secrets: inherit
    with:
      # ----- obrigatorios ---------------------------------------------------
      image-name: meu-app-api
      registry: registry.cliente.com.br

      # ----- Node / Nest ----------------------------------------------------
      node-version: '22'
      package-manager: 'pnpm'              # yarn | npm | pnpm
      pnpm-version: '9'                    # ignorado se nao for pnpm
      lint-command: 'pnpm lint'
      typecheck-command: 'pnpm tsc --noEmit'
      # Nest costuma ter dois alvos: test (unit) e test:e2e.
      # Encadeie com && pra rodar ambos no mesmo job.
      test-command: 'pnpm test'
      # test-command: 'pnpm test --ci && pnpm test:e2e --ci'

      # ----- comportamento por branch ---------------------------------------
      do-push: ${{ github.event_name == 'push' }}
      block-on-failure: ${{ github.ref == 'refs/heads/main' }}

      # ----- toggles de seguranca -------------------------------------------
      # SAST: Nest e backend; tira p/react do default do node.yml.
      semgrep-configs: 'p/owasp-top-ten p/typescript p/nodejs'

      # ----- monorepo Node+Rust (opcional) ----------------------------------
      # Se o repo tem subdiretorio com Cargo.lock (ex: contratos CosmWasm),
      # informe os paths separados por virgula pra rodar cargo audit.
      # cargo-audit-paths: 'blockchain'

      # ----- registry GCP via WIF (opcional) --------------------------------
      # Pra GCP Artifact Registry sem service account JSON key:
      # auth-method: 'gcp-wif'
      # gcp-workload-identity-provider: 'projects/123/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      # gcp-service-account: 'sa-name@projeto.iam.gserviceaccount.com'

      # ----- GitOps bump (opcional) -----------------------------------------
      # Apos build-push, faz checkout do repo de ops, bumpa newTag no
      # kustomization e commita. Roda em tag v* (env=prod) e/ou push em
      # homolog (env=homolog) conforme gitops-bump-on.
      # Pre-requisitos:
      #   - vars.APP_ID com o App ID do GitHub App (ou setar gitops-app-id-var).
      #   - secrets.GITOPS_APP_PRIVATE_KEY com a private key do App.
      #   - kustomization existe no path resolvido pelo template.
      # gitops-bump-enabled: true
      # gitops-repo: 'org/microservice-ops'
      # gitops-bump-on: 'both'                                        # tag | homolog | both
      # gitops-path-template: '{repo}-{env}/kustomization.yaml'       # placeholders: {repo} {env}
      # gitops-app-id-var: 'APP_ID'

      # ----- notificacao ----------------------------------------------------
      notify-channel: slack
      notify-on: failure
      slack-channel: '#ci-cliente-a'

      # ----- avancado -------------------------------------------------------
      # dockerfile-target: 'production'
      # platforms: 'linux/amd64'
      # build-args: |
      #   NODE_ENV=production
