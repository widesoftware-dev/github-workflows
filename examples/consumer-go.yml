# ============================================================================
# Exemplo de consumidor Go.
#
# Copie para `.github/workflows/ci.yml` no repo da aplicacao.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]

# Caller defines the upper bound of permissions for any reusable workflow.
# Without this block, the reusable runs with read-only defaults and fails to
# authenticate via WIF or post PR-report comments.
permissions:
  contents: read
  id-token: write       # required when auth-method: gcp-wif
  pull-requests: write  # required for pr-report comments
  packages: write       # required to push to ghcr.io (drop if not using)

jobs:
  ci:
    uses: widesoftware-dev/github-workflows/.github/workflows/go.yml@v1.2.0
    secrets: inherit
    with:
      # ----- obrigatorios ---------------------------------------------------
      image-name: meu-app-api
      registry: registry.cliente.com.br

      # ----- Go -------------------------------------------------------------
      # Use go-version-file pra extrair direto do go.mod (recomendado).
      go-version-file: 'go.mod'
      # ou go-version: '1.23'
      test-command: 'go test -race -count=1 ./...'
      run-go-vet: true
      run-staticcheck: true
      # run-golangci-lint: true    # precisa de .golangci.yml no repo

      # ----- comportamento por branch ---------------------------------------
      do-push: ${{ github.event_name == 'push' }}
      block-on-failure: ${{ github.ref == 'refs/heads/main' }}

      # ----- toggles de seguranca -------------------------------------------
      # run-secrets-scan: true
      # run-vuln-scan: true
      # run-sast: true
      # run-dependency-scan: true   # roda govulncheck
      # run-container-scan: true

      # ----- notificacao ----------------------------------------------------
      notify-channel: slack
      notify-on: failure
      slack-channel: '#ci-cliente-a'

      # ----- avancado -------------------------------------------------------
      # build-tags: 'integration,unit'
      # dockerfile-target: 'release'
      # platforms: 'linux/amd64,linux/arm64'
      # build-args: |
      #   VERSION=${{ github.ref_name }}
